# ReXGlue recompilation manifest for Sonic & All-Stars Racing Transformed (Xbox 360, title 5345085D, default.xex).
#
# Run tools/codegen.ps1 (Windows): it calls `rexglue codegen sasrt_manifest.toml` and the post-codegen steps. The
# project name sets the prefix of everything generated: generated/default/sasrt_{init,pch,funcs}.h,
# sasrt_recomp.N.cpp, and the CMake target sasrt_recomp built by CMakeLists.txt.
#
# default.xex (original PE name ASN_Xb360_10.exe, XDK 2.0.21119): image base 0x82000000, entry point 0x824679C0,
# image size 0x015E0000, XEX version 0.0.0.2, media ID 1A24E92E.

[project]
name = "sasrt"
sdk_version = "0.10.0"
# Your own game files: the extracted disc (assets/game_root, made by tools/god_extract.py from a Games on Demand
# package or tools/extract_iso.py from a disc image), with default.xex at its root. Nothing from the game is
# distributed with this project.
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/default.xex"
out_directory_path = "generated/default"

# The includes are processed before this table, so whatever is set here overrides what is included.
#   overrides.toml       written by hand: code the automatic function discovery misses, each with its evidence
#   thunks.toml          generated by tools/thunk_table.py: the 62,826 jump thunks of .xidata, each a function
#   codegen_flavor.toml  the codegen flavour (tools/codegen.ps1 -Flavor): a copy of perf_overrides.toml (registers as
#                        C++ locals, ...) for "optimised", the default and the one shipped; empty for "classic"
#                        (diagnosis on the PC only); docs/enhancements.md.
includes = ["thunks.toml", "overrides.toml", "codegen_flavor.toml"]

# No [[modules]]: the disc holds no other executable (22 files: default.xex, the Data/*.M00 archives with their .toc,
# Data/sound/*.pck, Data/Movies/*.usm, the dashboard's AvatarAssetPack and nxeart, and $SystemUpdate), and the XEX
# imports only xam.xex and xboxkrnl.exe.
